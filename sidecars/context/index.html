<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context Usage</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
    --c-ok: #81c995;
    --c-warn: #f9ab00;
    --c-err: #f28b82;
    --fg: var(--foreground, #e3e3e3);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .25));
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
    --surface: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* thin overlay-style scrollbar instead of the platform default */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  /* preload.js zeroes the body's padding, so the page padding lives here */
  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }

  /* drill-down navigation bar */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
  }
  .nav-meta {
    min-width: 0;
    flex: 1;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-role { font-weight: 600; }

  /* header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .model { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: var(--c-ok); }
  .usage { margin: 2px 0 6px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .usage .of { color: var(--dim); }
  .usage .pct { margin-left: auto; font-size: 13px; font-weight: 600; }
  .budget-line, .cache-line, .tps-line, .hook-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .budget-val,
  .budget-pct,
  .sub-val,
  .sub-pct { color: var(--c-ok); }
  .budget-line.warn .budget-val,
  .budget-line.warn .budget-pct,
  .sub-val.warn,
  .sub-pct.warn { color: var(--c-warn); }
  .budget-line.critical .budget-val,
  .budget-line.critical .budget-pct,
  .sub-val.danger,
  .sub-pct.danger { color: var(--c-err); }
  .pills { display: inline-flex; gap: 3px; }
  .pill {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--dim);
    border: 1px solid var(--line);
    background: transparent;
  }
  .pill.active {
    color: var(--c-agent);
    border-color: color-mix(in srgb, var(--c-agent) 55%, transparent);
    background: color-mix(in srgb, var(--c-agent) 12%, transparent);
    font-weight: 600;
  }
  .grid { margin-top: 6px; }
  button {
    font: inherit; font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  button:hover { color: var(--fg); border-color: var(--dim); }
  .btn-xs { font-size: 11px; padding: 2px 6px; border-radius: 5px; }

  /* grid: each dot is 1% of the context window */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 320px; margin-bottom: 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--dot-color, var(--empty)); }
  .legend { font-size: 11px; color: var(--dim); margin-bottom: 4px; }

  /* sections */
  section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; display: flex; justify-content: space-between; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .note { font-size: 12px; color: var(--dim); margin: -2px 0 8px; }
  .group + .group { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; padding: 2.5px 0; }
  .row .tok { text-align: right; }
  .row .p { text-align: right; color: var(--dim); font-size: 12px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--mark-color, transparent); }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  /* subagents */
  .sub-list { display: flex; flex-direction: column; gap: 8px; }
  .sub-toggle { width: 100%; margin-top: 8px; padding: 4px 8px; font-size: 11.5px; text-align: center; }
  .sub-card {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    background: var(--surface);
  }
  .sub-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sub-title {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .sub-role {
    font-weight: 600;
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub-actions { display: flex; align-items: center; gap: 4px; flex: none; }

  .state-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
  .state-dot.running, .state-dot.generating, .state-dot.starting { background: var(--c-agent); }
  .state-dot.reported { background: var(--c-ok); }
  .state-dot.canceled { background: var(--c-warn); }
  .state-dot.error { background: var(--c-err); }

  .state-pill {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 0 5px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .state-pill.running, .state-pill.generating, .state-pill.starting {
    color: var(--c-agent);
    border-color: color-mix(in srgb, var(--c-agent) 45%, transparent);
  }
  .state-pill.reported {
    color: var(--c-ok);
    border-color: color-mix(in srgb, var(--c-ok) 45%, transparent);
  }
  .state-pill.canceled {
    color: var(--c-warn);
    border-color: color-mix(in srgb, var(--c-warn) 45%, transparent);
  }
  .state-pill.error {
    color: var(--c-err);
    border-color: color-mix(in srgb, var(--c-err) 45%, transparent);
  }

  .sub-meter {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .bar-track {
    height: 5px;
    border-radius: 999px;
    background: var(--empty);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: var(--fill, 0%);
    background: var(--c-agent);
    border-radius: 999px;
  }
  .bar-fill.warn { background: var(--c-warn); }
  .bar-fill.danger { background: var(--c-err); }
  .sub-stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11.5px;
    color: var(--dim);
    flex-wrap: wrap;
  }
  .ck-tag {
    color: var(--c-custom);
    font-weight: 500;
  }

  .sub-activity {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
  }
  .sub-act-text {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  details.sub-steps {
    margin-top: 4px;
    font-size: 11.5px;
  }
  details.sub-steps summary {
    cursor: pointer;
    color: var(--dim);
    user-select: none;
    font-size: 11px;
  }
  details.sub-steps summary:hover { color: var(--fg); }
  .step-list {
    margin-top: 4px;
    padding-left: 8px;
    border-left: 1.5px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .step-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    color: var(--dim);
  }
  .step-lbl {
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; }
  .files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir { display: block; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .tok { color: var(--dim); font-size: 12px; align-self: start; }
  ul { list-style: none; margin: 0; padding: 0; }
  .ck-main { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; color: var(--c-ok); border: 1px solid color-mix(in srgb, var(--c-ok) 40%, transparent); border-radius: 999px; padding: 0 7px; white-space: nowrap; }

  .empty { margin: 48px 8px; text-align: center; color: var(--dim); }
  footer { margin-top: 16px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="main"><p class="empty">Loading…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const SUBAGENT_DEFAULT_LIMIT = 3;
  const SEGMENT_COLORS = ['var(--c-system)', 'var(--c-user)', 'var(--c-agent)', 'var(--c-tool)', 'var(--c-custom)'];
  const CONVERSATION = { user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)', system_messages: 'var(--c-sysmsg)' };
  const SYSTEM = new Set(['system_prompt', 'system_tools', 'system_overhead']);
  const STATE_LABELS = {
    starting: 'Starting',
    running: 'Running',
    generating: 'Generating',
    reported: 'Reported',
    idle: 'Idle',
    canceled: 'Canceled',
    error: 'Error',
  };
  const params = new URLSearchParams(location.search);
  const conversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');
  let workspace = '';
  let targetId = params.get('targetId') || '';
  let report = null;
  let lastJson = '';
  let showAllSubagents = false;
  const openStepDetails = new Set();

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    if (n >= 1e6) { const v = n / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (n >= 1e3) return `${(n / 1e3).toFixed(1)}k`;
    return String(n || 0);
  }

  function fmtDur(sec) {
    if (!sec || sec <= 0) return '';
    if (sec < 60) return `${sec}s`;
    if (sec < 3600) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return s ? `${m}m ${s}s` : `${m}m`;
    }
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  function fmtSec(sec) {
    const v = Number(sec || 0);
    if (v <= 0) return '0s';
    if (v < 10) return `${v.toFixed(1).replace(/\.0$/, '')}s`;
    if (v < 60) return `${Math.round(v)}s`;
    const total = Math.round(v);
    if (total < 3600) {
      const m = Math.floor(total / 60);
      const s = total % 60;
      return s ? `${m}m${s}s` : `${m}m`;
    }
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    return m ? `${h}h${m}m` : `${h}h`;
  }

  // The CLI's cell allocation: at least one cell per non-empty segment, scaled down on overflow.
  function gridCells(segments, limit, total) {
    let counts = segments.map((t) => (!t || !limit ? 0 : Math.max(1, Math.floor(t / limit * total))));
    const used = counts.reduce((a, b) => a + b, 0);
    if (used > total) counts = counts.map((c) => Math.floor(c * total / used));
    return [...counts, total - counts.reduce((a, b) => a + b, 0)];
  }

  function grid(r) {
    const counts = gridCells(r.grid_segments, r.limit_tokens, 100);
    let dots = '';
    counts.forEach((n, i) => {
      dots += (i === 5 ? '<span class="dot"></span>' : `<span class="dot" style="--dot-color:${SEGMENT_COLORS[i]}"></span>`).repeat(n);
    });
    return `<div class="grid" title="Each dot is 1% of the context window">${dots}</div>`;
  }

  function categoryRow(c) {
    const color = CONVERSATION[c.key] || (SYSTEM.has(c.key) ? 'var(--c-system)' : 'var(--c-custom)');
    const shape = CONVERSATION[c.key] ? '' : ' sq';
    return `<div class="row"><span class="mark${shape}" style="--mark-color:${color}"></span><span>${esc(c.name)}</span>`
      + `<span class="tok num">${fmtTok(c.tokens)}</span><span class="p num">${c.pct.toFixed(1)}%</span></div>`;
  }

  function categories(r) {
    const conv = r.categories.filter((c) => CONVERSATION[c.key]);
    const rest = r.categories.filter((c) => !CONVERSATION[c.key]);
    const limit = r.limit_tokens;
    const freePct = limit ? (r.free_tokens / limit * 100).toFixed(1) : '0.0';
    const free = `<div class="row"><span class="mark free"></span><span class="dim">Free space</span>`
      + `<span class="tok num">${fmtTok(r.free_tokens)}</span><span class="p num">${freePct}%</span></div>`;
    const note = r.heading === 'Token usage by category' ? '' : `<p class="note">${esc(r.heading)}</p>`;
    const buffer = r.checkpoint_buffer
      ? `<p class="note">Checkpoint buffer: ${fmtTok(r.checkpoint_buffer)} tokens (not counted in usage)</p>` : '';
    return `<section><h2>Token usage</h2>${note}
      <div class="group">${conv.map((c) => categoryRow(c)).join('')}</div>
      ${rest.length ? `<div class="group">${rest.map((c) => categoryRow(c)).join('')}</div>` : ''}
      <div class="group">${free}</div>${buffer}</section>`;
  }

  function navBar(r) {
    const parentId = r.parent_conversation_id || '';
    if (!parentId && !r.subagent_info) return '';
    const sinfo = r.subagent_info || {};
    const label = sinfo.role || sinfo.type_name || r.conversation_id.slice(0, 8);
    const typeTag = sinfo.type_name && sinfo.role ? ` <span class="dim">(${esc(sinfo.type_name)})</span>` : '';
    const backTarget = parentId === conversationId ? '' : parentId;
    return `<div class="nav-bar">
      ${parentId ? `<button type="button" class="btn-xs" data-action="inspect" data-id="${esc(backTarget)}" title="Return to parent conversation context">← Parent</button>` : ''}
      <div class="nav-meta" title="${esc(label)}"><span class="dim">Subagent:</span> <span class="nav-role">${esc(label)}</span>${typeTag}</div>
      <button type="button" class="btn-xs" data-action="open-chat" data-id="${esc(r.conversation_id)}" title="Open this subagent conversation in the main window">Open ↗</button>
    </div>`;
  }

  function budgetLine(r) {
    const budget = r.request_budget_tokens;
    if (!budget || !r.limit_tokens || budget >= r.limit_tokens) return '';
    const used = r.budget_used_tokens || r.used_tokens || 0;
    const pctVal = (used / budget) * 100;
    const bPct = pctVal.toFixed(1);
    const tone = pctVal >= 95 ? ' critical' : (pctVal >= 80 ? ' warn' : '');
    const ckCount = Array.isArray(r.checkpoints) ? r.checkpoints.length : 0;
    const ckText = ckCount > 0 ? `<span class="ck-tag">Compacted ×${ckCount}</span>` : '<span> Compaction threshold</span>';
    return `<div class="budget-line num${tone}" title="Effective tokens checked against the compaction threshold (${fmtTok(budget)})">
      <span>Request budget: <strong class="budget-val">${fmtTok(used)}</strong> / ${fmtTok(budget)} (<strong class="budget-pct">${bPct}%</strong>)</span>
      ${ckText}
    </div>`;
  }

  function hookLine(r) {
    const budget = r.request_budget_tokens;
    if (!budget || !r.limit_tokens || budget >= r.limit_tokens) return '';
    const mode = r.hookConfig?.agentAlert || 'tiered';
    const opts = [
      { id: 'off', label: 'Off', tip: 'Disable PostInvocation compaction alerts to the agent' },
      { id: 'critical', label: '≥95%', tip: 'Notify agent via ephemeralMessage only at ≥95% / ≥100% and after compaction' },
      { id: 'tiered', label: '≥85%', tip: 'Notify agent via ephemeralMessage at ≥85%, ≥95%, ≥100% and after compaction' },
    ];
    const pills = opts.map((o) =>
      `<button type="button" class="pill${mode === o.id ? ' active' : ''}" data-action="set-alert" data-mode="${o.id}" title="${esc(o.tip)}">${o.label}</button>`
    ).join('');
    return `<div class="hook-line num" title="Inject ephemeral compaction warning to the agent in PostInvocation">
      <span>Agent alert</span>
      <span class="pills">${pills}</span>
    </div>`;
  }

  function cacheLine(r) {
    const cs = r.cache_stats;
    if (!cs || !cs.turns) return '';
    return `<div class="cache-line num" title="Latest turn cache read / prompt tokens (hit rate) · Cumulative session cache read across ${cs.turns} LLM turn(s)">
      <span>Cache read: <strong>${fmtTok(cs.last_cache_read_tokens)}</strong>/${fmtTok(cs.last_prompt_tokens)} (${cs.last_hit_pct.toFixed(1)}%)</span>
      <span>Σ <strong>${fmtTok(cs.total_cache_read_tokens)}</strong> (${cs.total_hit_pct.toFixed(1)}% · ${cs.turns}t)</span>
    </div>`;
  }

  function tpsLine(r) {
    const os = r.output_stats;
    if (!os || !os.turns || !os.last_tps) return '';
    const breakdown = os.last_thinking_tokens
      ? ` (${fmtTok(os.last_thinking_tokens)} think + ${fmtTok(os.last_response_tokens)} resp)`
      : '';
    const tip = `Latest turn: ${fmtTok(os.last_output_tokens)} out${breakdown} in ${os.last_duration_seconds.toFixed(2)}s (TTFT ${os.last_ttft_seconds.toFixed(2)}s + stream ${os.last_stream_seconds.toFixed(2)}s) · Session avg: ${os.avg_tps.toFixed(1)} tok/s across ${os.turns} turn(s) (${fmtTok(os.total_output_tokens)} out in ${os.total_duration_seconds.toFixed(1)}s)`;
    return `<div class="tps-line num" title="${esc(tip)}">
      <span>Output: <strong>${os.last_tps.toFixed(1)} tok/s</strong> (TTFT ${fmtSec(os.last_ttft_seconds)}/${fmtSec(os.last_duration_seconds)})</span>
      <span>Avg <strong>${os.avg_tps.toFixed(1)}</strong> · Σ ${fmtTok(os.total_output_tokens)}</span>
    </div>`;
  }

  function subagentCard(s) {
    const id = s.conversation_id;
    const role = s.role || s.type_name || id.slice(0, 8);
    const state = s.state || 'idle';
    const stateLabel = STATE_LABELS[state] || state;
    const budget = s.request_budget_tokens || s.limit_tokens || 0;
    const budgetUsed = s.budget_used_tokens || s.used_tokens || 0;
    const rawPct = budget ? (budgetUsed / budget) * 100 : (s.used_pct || 0);
    const pctVal = Math.min(100, rawPct);
    const toneClass = rawPct >= 95 ? ' danger' : (rawPct >= 80 ? ' warn' : '');
    const dur = fmtDur(s.duration_seconds);
    const metaParts = [];
    if (s.type_name && s.role) metaParts.push(s.type_name);
    metaParts.push(`${s.step_count || 0} steps`);
    if (dur) metaParts.push(dur);

    const cs = s.cache_stats;
    const cacheRow = cs && cs.turns ? `<div class="sub-stats num" title="Latest turn cache read (hit rate) · Cumulative cache read across ${cs.turns} turn(s)">
      <span>Cache read: <strong>${fmtTok(cs.last_cache_read_tokens)}</strong> (${cs.last_hit_pct.toFixed(1)}%)</span>
      <span>Total: <strong>${fmtTok(cs.total_cache_read_tokens)}</strong> (${cs.total_hit_pct.toFixed(1)}% · ${cs.turns}t)</span>
    </div>` : '';

    const os = s.output_stats;
    const tpsRow = os && os.turns && os.last_tps ? `<div class="sub-stats num" title="Latest turn: ${fmtTok(os.last_output_tokens)} out in ${os.last_duration_seconds.toFixed(2)}s (TTFT ${os.last_ttft_seconds.toFixed(2)}s + stream ${os.last_stream_seconds.toFixed(2)}s) · Cumulative avg across ${os.turns} turn(s)">
      <span>TPS: <strong>${os.last_tps.toFixed(1)}</strong> (TTFT ${fmtSec(os.last_ttft_seconds)}/${fmtSec(os.last_duration_seconds)})</span>
      <span>Avg: <strong>${os.avg_tps.toFixed(1)}</strong> (${fmtTok(os.total_output_tokens)})</span>
    </div>` : '';

    const steps = Array.isArray(s.recent_steps) ? s.recent_steps : [];
    const isOpen = openStepDetails.has(id) ? ' open' : '';
    const stepsHtml = steps.length ? `
      <details class="sub-steps" data-sub-id="${esc(id)}"${isOpen}>
        <summary>Recent steps (${steps.length})</summary>
        <ul class="step-list">
          ${steps.map((st) => `<li class="step-item" title="${esc(st.detail || st.label)}">
            <span class="step-lbl">${esc(st.label)}</span>
            <span class="num">#${st.idx + 1}</span>
          </li>`).join('')}
        </ul>
      </details>` : '';

    return `<li class="sub-card">
      <div class="sub-head">
        <div class="sub-title" title="${esc(role)} (${esc(s.model)})">
          <span class="state-dot ${esc(state)}"></span>
          <span class="sub-role">${esc(role)}</span>
        </div>
        <span class="state-pill ${esc(state)}">${esc(stateLabel)}</span>
      </div>
      <div class="sub-meter">
        <div class="bar-track"><div class="bar-fill${toneClass}" style="--fill:${pctVal.toFixed(1)}%"></div></div>
        <div class="sub-stats num">
          <span><strong class="sub-val${toneClass}">${fmtTok(budgetUsed)}</strong> / ${budget ? `${fmtTok(budget)} (<span class="sub-pct${toneClass}">${rawPct.toFixed(1)}%</span>)` : `${fmtTok(s.limit_tokens)}`}${s.checkpoint_count ? ` · <span class="ck-tag">Compacted ×${s.checkpoint_count}</span>` : ''}</span>
          <span>${esc(metaParts.join(' · '))}</span>
        </div>
        ${cacheRow}
        ${tpsRow}
      </div>
      <div class="sub-activity">
        <span class="sub-act-text" title="${esc(s.current_action)}">${esc(s.current_action || 'Idle')}</span>
        <div class="sub-actions">
          <button type="button" class="btn-xs" data-action="inspect" data-id="${esc(id)}" title="Inspect this subagent's context breakdown">Context</button>
          <button type="button" class="btn-xs" data-action="open-chat" data-id="${esc(id)}" title="Switch to this subagent conversation in the main window">Open ↗</button>
        </div>
      </div>
      ${stepsHtml}
    </li>`;
  }

  function subagentsSection(r) {
    const list = Array.isArray(r.subagents) ? r.subagents : [];
    if (!list.length) return '';
    const activeCount = list.filter((s) => s.state === 'running' || s.state === 'generating' || s.state === 'starting').length;
    const reportedCount = list.filter((s) => s.state === 'reported').length;
    const totalUsed = list.reduce((sum, s) => sum + (s.used_tokens || 0), 0);
    const summaryParts = [];
    if (activeCount) summaryParts.push(`${activeCount} active`);
    if (reportedCount) summaryParts.push(`${reportedCount} reported`);
    summaryParts.push(`${list.length} total`);
    if (totalUsed) summaryParts.push(`${fmtTok(totalUsed)} ctx`);
    const collapsedLimit = Math.max(SUBAGENT_DEFAULT_LIMIT, activeCount);
    const canCollapse = list.length > collapsedLimit;
    const visibleList = !canCollapse || showAllSubagents ? list : list.slice(0, collapsedLimit);
    const hiddenCount = list.length - visibleList.length;
    const toggleBtn = canCollapse
      ? `<button type="button" class="sub-toggle num" data-action="toggle-subagents">${showAllSubagents ? 'Show less' : `Show all ${list.length} (${hiddenCount} more)`}</button>`
      : '';
    return `<section>
      <h2>Subagents <span class="hint num">${esc(summaryParts.join(' · '))}</span></h2>
      <ul class="sub-list">${visibleList.map((s) => subagentCard(s)).join('')}</ul>
      ${toggleBtn}
    </section>`;
  }

  function checkpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="dim" style="font-size:12px">${ck.historical} older checkpoint(s) summarized, not in context</div>` : '';
    return `<section><h2>Checkpoints <span class="hint">${ck.count} · /rewind</span></h2>
      <div class="ck-main"><span>Checkpoint ${ck.active_number}: ${esc(ck.active_text)}</span><span class="badge">in context</span></div>${older}</section>`;
  }

  function splitPath(path) {
    const norm = String(path || '').replace(/\\/g, '/');
    const trimmed = norm.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (norm.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    const activeConv = report?.conversation_id || conversationId;
    if (activeConv) dir = dir.replace(new RegExp(`^.*/brain/${activeConv}`), 'conversation folder');
    return { name, dir };
  }

  function files(title, hint, items) {
    if (!items || !items.length) return '';
    const rows = items.map((f) => {
      const { name, dir } = splitPath(f.path);
      return `<li title="${esc(f.path)}"><span class="name">${esc(name)}<span class="dir">‎${esc(dir)}</span></span>`
        + `<span class="tok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
    }).join('');
    return `<section><h2>${title} <span class="hint">${hint}</span></h2><ul class="files">${rows}</ul></section>`;
  }

  function render(r) {
    const limit = r.limit_tokens;
    main.innerHTML = `
      ${navBar(r)}
      <div class="top">
        <div class="model"><span class="live on" title="Live"></span>${esc(r.model)}</div>
        <button type="button" id="copy" title="Copy the report as the CLI prints it">Copy as text</button>
      </div>
      <div class="usage">
        <span class="big num">${fmtTok(r.used_tokens)}</span>
        <span class="of">/ ${limit ? fmtTok(limit) : 'Unknown'} tokens</span>
        ${limit ? `<span class="pct num">${r.used_pct.toFixed(1)}%</span>` : ''}
      </div>
      ${budgetLine(r)}
      ${cacheLine(r)}
      ${tpsLine(r)}
      ${hookLine(r)}
      ${grid(r)}
      ${categories(r)}
      ${subagentsSection(r)}
      ${checkpoints(r)}
      ${files('Knowledge files', '/rules', r.knowledge_files)}
      ${files('Artifact files', '/artifact', r.artifact_files)}
      ${files('Skill files', '/skill', r.skill_files)}
      ${files('System files', 'auto-loaded', r.system_files)}
      <footer><span>Related: /artifact · /skill · /rewind</span><span>Updated ${esc(new Date(r.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</span></footer>`;
  }

  main.addEventListener('click', (event) => {
    const btn = event.target.closest('button');
    if (!btn) return;
    if (btn.id === 'copy') {
      copy(btn);
      return;
    }
    const action = btn.dataset.action;
    const id = btn.dataset.id || '';
    if (action === 'set-alert') {
      const mode = btn.dataset.mode || '';
      if (mode) updateHookConfig({ agentAlert: mode });
      return;
    }
    if (action === 'toggle-subagents') {
      showAllSubagents = !showAllSubagents;
      if (report) render(report);
      return;
    }
    if (action === 'inspect') {
      targetId = id === conversationId ? '' : id;
      showAllSubagents = false;
      lastJson = '';
      refresh();
    } else if (action === 'open-chat' && id) {
      if (window.sidecar?.ui?.toggleConversation) {
        window.sidecar.ui.toggleConversation(id);
      }
    }
  });

  main.addEventListener('toggle', (event) => {
    const det = event.target;
    if (det && det.matches('details.sub-steps')) {
      const id = det.dataset.subId;
      if (!id) return;
      if (det.open) openStepDetails.add(id);
      else openStepDetails.delete(id);
    }
  }, true);

  function showMessage(text) {
    report = null;
    lastJson = '';
    main.innerHTML = `<p class="empty">${esc(text)}</p>`;
  }

  async function copy(btn) {
    if (!report) return;
    try {
      await navigator.clipboard.writeText(report.text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy as text'; }, 1500);
  }

  async function updateHookConfig(patch) {
    try {
      const res = await doFetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await res.json();
      if (data?.hookConfig && report) {
        report.hookConfig = data.hookConfig;
        lastJson = JSON.stringify(report);
        render(report);
      }
    } catch { /* next poll will resync */ }
  }

  async function refresh() {
    if (document.hidden) return;
    try {
      const qs = new URLSearchParams({ conversationId, workspace });
      if (targetId) qs.set('targetId', targetId);
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();
      if (data.error === 'no-conversation') return showMessage('Open a conversation to see its context usage.');
      if (data.error === 'no-database') return showMessage('This conversation has no saved data yet. Send a message first.');
      if (data.error) return showMessage(`Couldn't read this conversation: ${data.message || data.error}`);
      const json = JSON.stringify(data);
      if (json === lastJson) return;
      lastJson = json;
      report = data;
      render(data);
    } catch {
      const dot = document.querySelector('.live');
      if (dot) dot.classList.remove('on');
    }
  }

  document.addEventListener('visibilitychange', refresh);

  async function start() {
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      const uris = await window.sidecar.getWorkspaceUris();
      workspace = uris[0] || '';
      window.sidecar.onWorkspaceChange((next) => {
        if ((next[0] || '') !== workspace) { workspace = next[0] || ''; lastJson = ''; refresh(); }
      });
    }
    refresh();
    setInterval(refresh, POLL_MS);
  }
  start();
})();
</script>
</body>
</html>
